<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hive Mint — Local Workbench</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-icon">◆</span><div><strong>HIVE MINT</strong><small>LOCAL WORKBENCH / V0.1</small></div></div>
    <div class="top-right"><span id="ollama-status" class="status-dot">Checking Ollama…</span><span class="local-tag">● 127.0.0.1 ONLY</span></div>
  </header>
  <main>
    <section class="left-column">
      <div class="section-heading"><div><span class="eyebrow">OPERATIONS MAP</span><h1>The Workshop</h1></div><div class="map-legend">Buildings follow real job stages</div></div>
      <div class="map-frame"><canvas id="map" width="440" height="215" aria-label="Hive Mint job map"></canvas><div class="map-footer"><span id="map-caption">Select a building or a job</span><span>CLICK A STATION ◇</span></div></div>
      <div class="section-heading queue-heading"><div><span class="eyebrow">LIVE QUEUE</span><h2>Jobs on the floor</h2></div><button id="new-job" class="button primary">+ NEW JOB</button></div>
      <div id="queue" class="queue"></div>
      <div class="footer-note">Local files and decisions stay on this PC. Ollama prompts go to your local Ollama server.</div>
    </section>
    <section class="right-column">
      <div id="detail" class="detail"></div>
    </section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
